name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}

jobs:
  tests:
    name: Tests
    uses: netresearch/.github/.github/workflows/php-ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.4","8.5"]'
      # Only the PHPUnit suite is wired up here; the legacy sources are not
      # yet PHPStan/CGL-clean, so those checks stay off for now.
      run-phpstan: false
      run-phpunit: true
